name: freelancehunt-bot

on:
  schedule:
    - cron: "7 */3 * * *"   # backup only: GitHub often delays or drops scheduled runs
  workflow_dispatch:

permissions:
  contents: read
  actions: write   # lets the job start its own next run

# only one bot at a time: Telegram allows a single getUpdates consumer per bot
concurrency:
  group: freelancehunt-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: fh-state-${{ github.run_id }}
          restore-keys: fh-state-

      - name: Run bot
        env:
          FH_TOKEN: ${{ secrets.FH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PORTFOLIO_URL: ${{ secrets.PORTFOLIO_URL }}
          REDDIT_INBOX_RSS: ${{ secrets.REDDIT_INBOX_RSS }}
          REDDIT_RSS_PROXY: ${{ secrets.REDDIT_RSS_PROXY }}
          REDDIT_ENABLED: ${{ vars.REDDIT_ENABLED || '0' }}   # Reddit blocks GitHub runners; set the variable to 1 with REDDIT_RSS_PROXY
          OUTREACH_AUTO: ${{ vars.OUTREACH_AUTO }}
          OUTREACH_DAILY: ${{ vars.OUTREACH_DAILY }}
        run: python fh_bot.py --minutes 345

      - name: Save bot state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: fh-state-${{ github.run_id }}-${{ github.run_attempt }}

      # A job may run at most 6 h, so the bot hands over to a fresh run itself.
      # The new run waits in the concurrency queue until this one ends.
      - name: Start next run
        if: ${{ !cancelled() }}   # a manual Cancel stops the bot for good
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run freelancehunt-bot.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
