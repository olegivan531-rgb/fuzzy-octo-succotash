name: freelancehunt-bot

on:
  schedule:
    - cron: "7 */6 * * *"   # restart every 6 h (a job may run at most 6 h)
  workflow_dispatch:

# only one bot at a time: Telegram allows a single getUpdates consumer per bot
concurrency:
  group: freelancehunt-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: fh-state-${{ github.run_id }}
          restore-keys: fh-state-

      - name: Run bot
        env:
          FH_TOKEN: ${{ secrets.FH_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.GROQ_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python fh_bot.py --minutes 345

      - name: Save bot state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: fh-state-${{ github.run_id }}-${{ github.run_attempt }}
